{{ define "main" }}
<div class="page-header">
    <div class="container">
        <h1 class="page-title">{{ .Title }}</h1>
    </div>
</div>
<section class="section">
    <div class="container">
        <div class="post-list">
            {{ range .Pages }}
            <article class="post-list-item">
                <div class="post-list-meta">
                    <time datetime="{{ .Date.Format " 2006-01-02" }}">{{ .Date.Format "January 02, 2006" }}</time>
                </div>
                <h2 class="post-list-title"><a href="{{ .RelPermalink }}">{{ .Title }}</a></h2>
                <p class="post-list-summary">{{ .Summary | plainify | truncate 200 }}</p>
                <a href="{{ .RelPermalink }}" class="post-card-link">Continue reading →</a>
            </article>
            {{ end }}
        </div>
    </div>
</section>
{{ end }}
