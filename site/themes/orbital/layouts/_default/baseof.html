<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}" />
  <title>{{ if .IsHome }}{{ .Site.Title }} — {{ .Site.Params.tagline }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end
    }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Orbitron:wght@400;700;900&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="{{ .Site.BaseURL }}css/orbital.css?v={{ now.Unix }}" />
  {{ if .IsHome }}
  <link rel="stylesheet" href="{{ .Site.BaseURL }}css/home.css" />{{ end }}
</head>

<body>
  <div class="starfield" id="starfield"></div>

  <header class="site-header">
    <nav class="nav-container">
      <a href="{{ .Site.BaseURL }}" class="nav-logo">
        <span class="logo-icon">◈</span>
        <span class="logo-text">{{ .Site.Title }}</span>
      </a>
      <ul class="nav-links">
        {{ range .Site.Menus.main }}
        <li>
          <a href="{{ .URL }}" class="{{ if $.IsMenuCurrent " main" . }}active{{ end }}">
            {{ .Name }}
          </a>
        </li>
        {{ end }}
      </ul>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
    </nav>
  </header>

  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <div class="footer-brand">
        <span class="logo-icon">◈</span>
        <span>{{ .Site.Title }}</span>
      </div>
      <p class="footer-tagline">{{ .Site.Params.tagline }}</p>
      <div class="footer-links">
        {{ with .Site.Params.github }}<a href="{{ . }}" target="_blank" rel="noopener">GitHub</a>{{ end }}
      </div>
      <p class="footer-copy">Built with Hugo. Deployed to GitHub Pages.</p>
    </div>
  </footer>

  <script src="{{ .Site.BaseURL }}js/orbital.js"></script>
</body>

</html>
