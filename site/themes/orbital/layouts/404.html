{{ define "main" }}
<div class="page-container page-404"
    style="min-height: 75vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; position: relative; z-index: 1;">

    <div class="hero-eyebrow" style="margin-bottom: 2rem;">
        <span class="pulse-dot"
            style="background:#ef4444; width:10px; height:10px; box-shadow: 0 0 12px rgba(239, 68, 68, 0.4);"></span>
        <span style="color:#ef4444;">COMMUNICATION LOST</span>
    </div>

    <h1 class="st-title"
        style="font-size: clamp(6rem, 15vw, 12rem); margin: 0; line-height: 1; text-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 20px rgba(255,255,255,0.2); font-family: 'Orbitron', sans-serif; color: #f0f4ff;">
        404</h1>

    <p class="st-subtitle"
        style="font-size: 1.1rem; max-width: 500px; margin: 1.5rem auto 3.5rem; color: var(--text-secondary); line-height: 1.6;">
        The requested node could not be found in the constellation. The packet may have been lost to deep space, or the
        trajectory was miscalculated.
    </p>

    <a href="{{ " /" | relURL }}" class="st-modal-complete"
        style="display: inline-flex; text-decoration: none; padding: 0.8rem 2rem; border-radius: 100px; font-size: 0.85rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #fff; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.15); transition: all 0.2s; font-family: 'Inter', sans-serif;">
        INITIATE RETURN TRAJECTORY
    </a>

    <style>
        .page-404 .st-modal-complete:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.4);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }
    </style>
</div>
{{ end }}
